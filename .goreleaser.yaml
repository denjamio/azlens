version: 2

project_name: azlens

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/azlens
    binary: azlens
    ldflags:
      - -s -w
      - -X github.com/denjamio/azlens/cmd.Version={{.Version}}
      - -X github.com/denjamio/azlens/cmd.Commit={{.Commit}}
      - -X github.com/denjamio/azlens/cmd.Date={{.Date}}

archives:
  - formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - README.md
      - CHANGELOG.md
      - azlens.example.yaml

checksum:
  name_template: 'checksums.txt'

release:
  draft: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
