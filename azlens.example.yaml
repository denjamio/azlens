# ─────────────────────────────────────────────────────────────────────────────
# AzLens Configuration Reference (azlens.yaml)
#
# CONVENTIONS & ARCHITECTURE:
# 1. SHARED TARGET:
#    Declare ONCE in 'shared:' everything that does not vary across environments.
#    Profiles inherit shared settings and override only what differs
#    (typically insights.name and logs.workspace_id).
#
# 2. MULTI-TENANCY & SERVICE ISOLATION:
#    - Multi-tenancy requires 'shared.logs.database' and an active service.
#    - Queries enforce tenant isolation on Log Analytics (database) and App Insights (role).
#    - Application queries require a role filter; database queries require a database filter.
#
# 3. SERVICE CATALOG:
#    - 'shared.services' maps logical service names to physical telemetry targets:
#        role: EXACT cloud_RoleName in Application Insights
#        pod:  cloud_RoleInstance base token without the dynamic replica hash
#    - 'defaults.service' specifies the default active service.
#    - CLI: target any service with '-s <name>' or '--service <name>'.
#    - Ad-hoc fallback: if '-s <name>' is not defined in services, role and pod
#      both default to '<name>'.
#
# 4. AZURE SESSIONS & SCRIPTING:
#    - azlens delegates authentication to the Azure CLI ('az').
#    - Subscription and tenant IDs guide token routing; no tokens are stored locally.
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"

defaults:
  profile: prod
  service: checkout
  window: "1h"
  since: "1h"
  limit: 15
  output: "table"

shared:
  insights:
    resource_group: "rg-shared-prod"
    directory_id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
    subscription_id: "11111111-aaaa-bbbb-cccc-111111111111"
  logs:
    directory_id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
    subscription_id: "22222222-dddd-eeee-ffff-222222222222"
    database: "backend_ror"

  services:
    checkout:
      role: checkout-service
      pod: checkout-app
    orders:
      role: order-service
      pod: order-app
    billing:
      role: billing-service
      pod: billing-worker

  exclude_synthetic: true
  exclude_probes: true

  thresholds:
    p95_latency_warn_pct: 15.0
    p95_latency_crit_pct: 30.0
    error_rate_warn_delta: 1.0
    error_rate_crit_delta: 3.0
    min_sample_calls: 5

profiles:
  prod:
    name: "Production Microservices"
    target:
      insights:
        name: "app-shared-prod"
      logs:
        workspace_id: "33333333-hhhh-iiii-jjjj-333333333333"

  staging:
    name: "Staging Environment"
    target:
      insights:
        name: "app-shared-staging"
      logs:
        workspace_id: "44444444-aaaa-bbbb-cccc-444444444444"
    defaults:
      window: "30m"
      since: "15m"
    thresholds:
      p95_latency_warn_pct: 25.0
      p95_latency_crit_pct: 50.0
      error_rate_warn_delta: 2.0
      error_rate_crit_delta: 5.0
      min_sample_calls: 5

  dev:
    name: "Development Environment"
    target:
      insights:
        name: "app-shared-dev"
      logs:
        workspace_id: "55555555-eeee-ffff-dddd-555555555555"
