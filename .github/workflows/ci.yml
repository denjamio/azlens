name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to the same minor validated locally (2.13.x): the config
          # file (.golangci.yml) uses the v2 schema, and 'latest' resolves
          # flakily to v1.64.8, which cannot parse it (config verify fails
          # before linting)
          version: v2.13

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run unit tests (with race detector)
        run: go test -race -v ./...

      - name: Verify build
        run: CGO_ENABLED=0 go build -v -o bin/azlens ./cmd/azlens
