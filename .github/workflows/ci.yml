name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v7 of the action is required for golangci-lint v2 (v6 rejects v2
          # version strings and resolves 'latest' to the last v1 release,
          # 1.64.8, whose config verify cannot parse our v2 .golangci.yml).
          # Pinned to the same minor validated locally (2.13.x).
          version: v2.13

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install kql-guard
        run: |
          curl -fsSL -o /usr/local/bin/kql-guard https://github.com/microsoft/kql-guard/releases/download/v0.2.0/kql-guard-linux-x64
          chmod +x /usr/local/bin/kql-guard

      - name: Run unit tests (with race detector and kql-guard validation)
        run: go test -race -v ./...

      - name: Verify build
        run: CGO_ENABLED=0 go build -v -o bin/azlens ./cmd/azlens
